<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Mini Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{

      --primary:#ff5b91;
      --primary-dark:#ff4b82;

      --purple:#9a7dff;

      --text:#1f245c;
      --sub:#8b90ad;

      --bg:#fffafb;

      --soft:#fff2f6;

      --border:#f3dfe7;

      --card:#ffffff;
    }

    body{
      font-family:'Nunito',sans-serif;
      background:var(--bg);

      display:flex;
      justify-content:center;

      color:var(--text);
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;

      padding:18px 18px 40px;

      background:
        radial-gradient(circle at top right,#fff1f5 0%,transparent 30%),
        radial-gradient(circle at bottom left,#f6efff 0%,transparent 35%),
        #fffafb;

      overflow:hidden;
      position:relative;
    }

    /* =========================
       STATUS BAR
    ========================== */

    .status{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:22px;

      color:#111;
      font-size:14px;
      font-weight:800;
    }

    .status-right{
      display:flex;
      align-items:center;
      gap:6px;

      font-size:13px;
    }

    /* =========================
       HEADER
    ========================== */

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin-bottom:24px;
    }

    .back{
      font-size:25px;
      color:#1f245c;
      font-weight:700;
    }

    .title{
      font-size:22px;
      font-weight:900;

      color:#1f245c;

      letter-spacing:-0.3px;
    }

    .menu{
      font-size:24px;
      color:#1f245c;
    }

    /* =========================
       HERO
    ========================== */

    .hero{
      text-align:center;

      margin-bottom:24px;
    }

    .hero h1{
      color:#1f245c;
      font-size:28px;
      font-weight:900;

      margin-bottom:8px;
    }

    .hero p{
      color:#8c91ad;
      font-size:15px;
      line-height:1.6;
      font-weight:700;
    }

    /* =========================
       TOP BAR
    ========================== */

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:18px;
    }

    .topic{
      color:#6f7598;
      font-size:15px;
      font-weight:800;
    }

    .topic span{
      color:#1f245c;
      font-weight:900;
    }

    .timer{
      background:
        linear-gradient(
          135deg,
          #ff7ca8 0%,
          #ff4f86 100%
        );

      color:#fff;

      height:34px;

      padding:0 14px;

      border-radius:999px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:14px;
      font-weight:900;

      box-shadow:
        0 10px 18px rgba(255,91,143,.16);
    }

    /* =========================
       DRAW CARD
    ========================== */

    .draw-card{
      position:relative;

      background:#fff;

      border:2px solid #f3dfe7;

      border-radius:32px;

      padding:24px 22px 18px;

      margin-bottom:18px;

      overflow:hidden;

      box-shadow:
        0 12px 24px rgba(255,145,180,.05);
    }

    .drawing{
      width:220px;
      height:180px;

      margin:0 auto 20px;

      display:flex;
      align-items:center;
      justify-content:center;

      position:relative;
    }

    .drawing img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    /* doodles */

    .spark{
      position:absolute;

      color:#ffb0cb;

      font-size:22px;
    }

    .s1{
      left:16px;
      top:28px;
    }

    .s2{
      left:40px;
      top:88px;
      color:#ffb94c;
    }

    .s3{
      left:62px;
      top:52px;
      color:#ff8fae;
    }

    .s4{
      right:28px;
      top:42px;
      color:#c48cff;
    }

    .arrow{
      position:absolute;

      right:20px;
      top:76px;

      color:#a46fff;

      font-size:16px;
      line-height:1.4;

      font-weight:900;

      transform:rotate(-6deg);
    }

    .arrow::after{
      content:"↷";

      position:absolute;

      right:10px;
      bottom:-24px;

      font-size:28px;

      color:#b17cff;
    }

    /* =========================
       COLORS
    ========================== */

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .colors{
      display:flex;
      gap:10px;
    }

    .color{
      width:18px;
      height:18px;

      border-radius:50%;
    }

    .c1{background:#ff3f56;}
    .c2{background:#ffb34d;}
    .c3{background:#73c66b;}
    .c4{background:#54b4b7;}
    .c5{background:#5f8dff;}
    .c6{background:#8d6bff;}

    .tools{
      display:flex;
      gap:16px;

      color:#8b90ad;
      font-size:18px;
    }

    /* =========================
       CHAT CARD
    ========================== */

    .chat-card{
      position:relative;

      background:#fff;

      border:2px solid #f3dfe7;

      border-radius:30px;

      padding:18px;

      margin-bottom:20px;

      box-shadow:
        0 10px 20px rgba(255,145,180,.05);
    }

    .message{
      display:flex;
      align-items:flex-start;
      gap:12px;

      margin-bottom:16px;
    }

    .message:last-child{
      margin-bottom:0;
    }

    .avatar{
      width:34px;
      height:34px;

      border-radius:50%;

      background:#fff3f7;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:18px;

      flex-shrink:0;
    }

    .bubble{
      flex:1;
    }

    .bubble h4{
      color:#1f245c;
      font-size:15px;
      line-height:1.45;
      font-weight:900;

      margin-bottom:4px;
    }

    .bubble p{
      color:#687093;
      font-size:14px;
      line-height:1.6;
      font-weight:700;
    }

    .correct{
      color:#39b56a;
      font-weight:900;
    }

    .chat-doodle{
      position:absolute;

      right:22px;
      bottom:30px;

      color:#b06fff;

      font-size:16px;
      line-height:1.3;

      font-weight:900;

      transform:rotate(-8deg);
    }

    .chat-doodle::after{
      content:"↶";

      position:absolute;

      left:-18px;
      bottom:-24px;

      font-size:28px;

      color:#b37eff;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .footer-item{
      color:#6f7598;
      font-size:15px;
      font-weight:800;
    }

    .footer-item span{
      color:#ff5b91;
      font-weight:900;
    }

    .footer-item.blue span{
      color:#5b75ff;
    }

  </style>
</head>
<body>

<div class="app">

  <!-- STATUS -->

  <div class="status">

    <div>9:41</div>

    <div class="status-right">
      <span>📶</span>
      <span>📡</span>
      <span>🔋</span>
    </div>

  </div>

  <!-- HEADER -->

  <div class="header">

    <div class="back">‹</div>

    <div class="title">
      9. Mini Game.png
    </div>

    <div class="menu">⋯</div>

  </div>

  <!-- HERO -->

  <div class="hero">

    <h1>
      Vẽ & Đoán 😵‍💫
    </h1>

    <p>
      Cùng nhau chơi mini game vui vẻ 💞
    </p>

  </div>

  <!-- TOP -->

  <div class="top-row">

    <div class="topic">
      Chủ đề:
      <span>Động vật 🐻</span>
    </div>

    <div class="timer">
      00:28
    </div>

  </div>

  <!-- DRAW CARD -->

  <div class="draw-card">

    <div class="spark s1">✦</div>
    <div class="spark s2">＋</div>
    <div class="spark s3">＋</div>
    <div class="spark s4">✦</div>

    <div class="arrow">
      vẽ trong<br>
      30 giây
    </div>

    <div class="drawing">

      <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png"/>

    </div>

    <div class="toolbar">

      <div class="colors">

        <div class="color c1"></div>
        <div class="color c2"></div>
        <div class="color c3"></div>
        <div class="color c4"></div>
        <div class="color c5"></div>
        <div class="color c6"></div>

      </div>

      <div class="tools">

        <span>🖌️</span>
        <span>🗑️</span>

      </div>

    </div>

  </div>

  <!-- CHAT -->

  <div class="chat-card">

    <div class="message">

      <div class="avatar">
        👦
      </div>

      <div class="bubble">

        <h4>
          Nam đoán: MÈO 😺
        </h4>

      </div>

    </div>

    <div class="message">

      <div class="avatar">
        👧
      </div>

      <div class="bubble">

        <h4>
          Châu đoán: Chó?
        </h4>

      </div>

    </div>

    <div class="message">

      <div class="avatar">
        👦
      </div>

      <div class="bubble">

        <h4>
          Nam đoán: Mèo con!! <span class="correct">✔</span>
        </h4>

      </div>

    </div>

    <div class="chat-doodle">
      chat đoán<br>
      vui vẻ ✨
    </div>

  </div>

  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-item">
      Câu <span>3/10</span>
    </div>

    <div class="footer-item blue">
      Điểm:
      <span>Châu 20 - 10 Nam</span>
    </div>

  </div>

</div>

</body>
</html>
